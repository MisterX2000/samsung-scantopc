[project]
name = "samsung-scantopc"
version = "0.7.0"
description = "Dockerized Samsung MFP Scan-to-PC server with automatic ADF/flatbed detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Mister X", email = "MisterX2000@users.noreply.github.com" },
    { name = "Finn Boeger" },
    { name = "Steffen Klee" },
    { name = "angelnu & Totally King" },
]
keywords = ["samsung", "scanner", "sane", "scan-to-pc", "mfp", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pillow>=10.0.0",
    "pypdf>=3.0.0",
    "pysnmp>=7.0.0",
    "zeroconf>=0.130.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/MisterX2000/samsung-scantopc"
Upstream = "https://github.com/finnboeger/samsung-scantopc"
Repository = "https://github.com/MisterX2000/samsung-scantopc.git"
Issues = "https://github.com/MisterX2000/samsung-scantopc/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "B904",  # raise ... from err
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
